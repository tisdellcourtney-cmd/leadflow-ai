name: LeadFlow AI v4 APEX

on:
  schedule:
    # Runs daily at 8:00 AM CST (14:00 UTC)
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no writes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      city_filter:
        description: 'Restrict to a single city (e.g. "Birmingham AL"). Leave blank for all cities.'
        required: false
        default: ''
      groq_model:
        description: 'Override Groq model (leave blank for default)'
        required: false
        default: ''

jobs:
  run-leadflow:
    name: Run LeadFlow AI Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
      VALUESERP_API_KEY:   ${{ secrets.VALUESERP_API_KEY }}
      BASE44_API_KEY:      ${{ secrets.BASE44_API_KEY }}
      BASE44_APP_ID:       ${{ secrets.BASE44_APP_ID }}
      TWILIO_ACCOUNT_SID:  ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN:   ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
      ALERT_PHONE_NUMBER:  ${{ secrets.ALERT_PHONE_NUMBER }}
      DRY_RUN:             ${{ github.event.inputs.dry_run || 'false' }}
      CITY_FILTER:         ${{ github.event.inputs.city_filter || '' }}
      GROQ_MODEL:          ${{ github.event.inputs.groq_model || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            groq \
            twilio \
            requests

      - name: Validate required secrets
        run: |
          missing=()
          [ -z "$GROQ_API_KEY" ]        && missing+=("GROQ_API_KEY")
          [ -z "$VALUESERP_API_KEY" ]    && missing+=("VALUESERP_API_KEY")
          [ -z "$BASE44_API_KEY" ]      && missing+=("BASE44_API_KEY")
          [ -z "$BASE44_APP_ID" ]       && missing+=("BASE44_APP_ID")
          [ -z "$TWILIO_ACCOUNT_SID" ]  && missing+=("TWILIO_ACCOUNT_SID")
          [ -z "$TWILIO_AUTH_TOKEN" ]   && missing+=("TWILIO_AUTH_TOKEN")
          [ -z "$TWILIO_PHONE_NUMBER" ] && missing+=("TWILIO_PHONE_NUMBER")
          [ -z "$ALERT_PHONE_NUMBER" ]  && missing+=("ALERT_PHONE_NUMBER")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Missing required secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required secrets present."

      - name: Run LeadFlow AI v4 APEX
        run: python leadflow_agent_v4.py

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leadflow-metrics-${{ github.run_id }}
          path: |
            leadflow_metrics_*.json
            leadflow_v4.log
          retention-days: 30

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: leadflow-failure-log-${{ github.run_id }}
          path: leadflow_v4.log
          retention-days: 14
