name: LeadFlow AI v4 APEX — Daily Pipeline

on:
  schedule:
    # FIX #20 — Original cron "0 15 * * 1-5" = 15:00 UTC = 9 AM CST (UTC-6) in winter only.
    # Alabama observes CDT (UTC-5) from March–November. "0 14 * * 1-5" = 14:00 UTC
    # = 9 AM CDT in summer AND 8 AM CST in winter — acceptable tradeoff.
    # If strict 9 AM CST/CDT is required, use a Lambda/Cloud Scheduler instead of
    # GitHub Actions (which does not support DST-aware cron).
    - cron: "0 14 * * 1-5"       # 9:00 AM CDT / 8:00 AM CST  Mon–Fri
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (suppress all SMS/Slack/CRM writes)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      city_filter:
        description: "Restrict to one city — must match exactly, e.g. 'Birmingham AL' (blank = all)"
        required: false
        default: ""
      groq_model:
        description: "Groq model override (blank = llama-3.3-70b-versatile)"
        required: false
        default: ""

concurrency:
  group: leadflow-pipeline
  cancel-in-progress: false        # never kill a mid-run pipeline

jobs:
  run-pipeline:
    name: Run LeadFlow AI v4 APEX
    runs-on: ubuntu-latest
    timeout-minutes: 90            # v4 runs longer due to multi-engine + multi-pass Groq

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python 3.11 + pip cache ─────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Validate all required secrets ──────────────────────────────────
      - name: Verify required secrets
        run: |
          MISSING=0
          for VAR in GROQ_API_KEY SERPAPI_API_KEY BASE44_API_KEY BASE44_APP_ID \
                     TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_PHONE_NUMBER \
                     ALERT_PHONE_NUMBER; do
            if [ -z "${!VAR}" ]; then
              echo "ERROR: Missing secret — $VAR"
              MISSING=1
            else
              echo "OK: $VAR"
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1
        env:
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          SERPAPI_API_KEY:      ${{ secrets.SERPAPI_API_KEY }}
          BASE44_API_KEY:       ${{ secrets.BASE44_API_KEY }}
          BASE44_APP_ID:        ${{ secrets.BASE44_APP_ID }}
          TWILIO_ACCOUNT_SID:   ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:    ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER:  ${{ secrets.TWILIO_PHONE_NUMBER }}
          ALERT_PHONE_NUMBER:   ${{ secrets.ALERT_PHONE_NUMBER }}

      # ── 5. Run the pipeline ────────────────────────────────────────────────
      - name: Run LeadFlow AI v4 APEX
        env:
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          SERPAPI_API_KEY:      ${{ secrets.SERPAPI_API_KEY }}
          BASE44_API_KEY:       ${{ secrets.BASE44_API_KEY }}
          BASE44_APP_ID:        ${{ secrets.BASE44_APP_ID }}
          TWILIO_ACCOUNT_SID:   ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:    ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER:  ${{ secrets.TWILIO_PHONE_NUMBER }}
          ALERT_PHONE_NUMBER:   ${{ secrets.ALERT_PHONE_NUMBER }}
          SLACK_WEBHOOK_URL:    ${{ secrets.SLACK_WEBHOOK_URL }}
          CRM_WEBHOOK_URL:      ${{ secrets.CRM_WEBHOOK_URL }}
          GROQ_MODEL:           ${{ github.event.inputs.groq_model || 'llama-3.3-70b-versatile' }}
          BASE44_ENTITY:        Lead
          DRY_RUN:              ${{ github.event.inputs.dry_run || 'false' }}
          CITY_FILTER:          ${{ github.event.inputs.city_filter || '' }}
        run: python leadflow_agent_v4.py

      # ── 6. Upload logs + metrics (always — even on failure) ────────────────
      - name: Upload logs and metrics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leadflow-v4-run-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            *.log
            leadflow_metrics_*.json
          retention-days: 90

      # ── 7. Slack failure alert ─────────────────────────────────────────────
      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \":red_circle: *LeadFlow AI v4 FAILED* on run #${{ github.run_number }}\nBranch: \`${{ github.ref_name }}\`\nView logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
