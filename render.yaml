services:
  - type: web
    name: leadflow-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python runner.py
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: BASE44_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
