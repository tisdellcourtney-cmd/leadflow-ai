name: LeadFlow AI v4 — Daily Run

# FIX #20 — 0 14 * * 1-5 = 8:00 AM UTC = 9:00 AM CDT (UTC-5, Mar–Nov)
# Alabama observes CDT in summer and CST (UTC-6) in winter.
# 14:00 UTC hits 9 AM CDT reliably for the majority of the business year.
on:
  schedule:
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no writes)"
        required: false
        default: "false"
      city_filter:
        description: "Restrict to one city (e.g. Birmingham AL)"
        required: false
        default: ""

jobs:
  run-leadflow:
    name: Run LeadFlow AI Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-leadflow-v4-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-leadflow-v4-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq serpapi google-search-results twilio requests

      - name: Run LeadFlow AI v4
        env:
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          SERPAPI_API_KEY:      ${{ secrets.SERPAPI_API_KEY }}
          BASE44_API_KEY:       ${{ secrets.BASE44_API_KEY }}
          BASE44_APP_ID:        ${{ secrets.BASE44_APP_ID }}
          TWILIO_ACCOUNT_SID:   ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:    ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER:  ${{ secrets.TWILIO_PHONE_NUMBER }}
          ALERT_PHONE_NUMBER:   ${{ secrets.ALERT_PHONE_NUMBER }}
          SLACK_WEBHOOK_URL:    ${{ secrets.SLACK_WEBHOOK_URL }}
          CRM_WEBHOOK_URL:      ${{ secrets.CRM_WEBHOOK_URL }}
          BASE44_ENTITY:        ${{ secrets.BASE44_ENTITY }}
          GROQ_MODEL:           ${{ secrets.GROQ_MODEL }}
          DRY_RUN:              ${{ github.event.inputs.dry_run || 'false' }}
          CITY_FILTER:          ${{ github.event.inputs.city_filter || '' }}
        run: |
          python leadflow_agent_v4.py

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leadflow-logs-${{ github.run_id }}
          path: |
            leadflow_v4.log
            leadflow_metrics_*.json
          retention-days: 30

      - name: Upload metrics JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leadflow-metrics-${{ github.run_id }}
          path: leadflow_metrics_*.json
          retention-days: 90
