name: LeadFlow AI Agent v4

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 14 * * 1-5'

jobs:
  run-leadflow:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LeadFlow Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
          BASE44_APP_ID: ${{ secrets.BASE44_APP_ID }}
          BASE44_ENTITY: ${{ secrets.BASE44_ENTITY }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_PHONE: ${{ secrets.TWILIO_PHONE }}
          ALERT_PHONE: ${{ secrets.ALERT_PHONE }}
          
          
          GROQ_MODEL_INPUT: ${{ secrets.GROQ_MODEL_INPUT }}
        run: python runner.py
