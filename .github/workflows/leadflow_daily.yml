name: LeadFlow AI - Daily Agent

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  run-leadflow-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install twilio google-search-results groq requests

      - name: Run LeadFlow Agent
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
          BASE44_APP_ID: 69f5719e46c0732dec4f4b06
          GROQ_MODEL: llama-3.3-70b-versatile
          BASE44_ENTITY: Lead
        run: python leadflow_agent.py
